<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>D&D Archive Dice</title>
  <style>
    /* The popover scrolls by wheel and touch; a bar beside it only eats width.
       Important: the site's stylesheet loads after this and gives every element
       a thin dark scrollbar of its own. */
    * { scrollbar-width: none !important; }
    *::-webkit-scrollbar { display: none !important; }

    /* The places that do scroll — each tab, as one piece — get a slim,
       rounded, quiet bar in the roller's own red on a clear track. Chrome and
       Safari draw it from the ::-webkit-scrollbar rules, which they ignore
       while scrollbar-width or scrollbar-color is set, so those go back to
       auto here; Firefox, which has no such rules, gets its own below. */
    .roller-scroll {
      scrollbar-width: auto !important;
      scrollbar-color: auto !important;
    }
    .roller-scroll::-webkit-scrollbar { display: block !important; width: 6px !important; }
    .roller-scroll::-webkit-scrollbar-track { background: transparent !important; }
    .roller-scroll::-webkit-scrollbar-thumb { background: rgba(204, 0, 48, 0.28) !important; border-radius: 999px !important; }
    .roller-scroll::-webkit-scrollbar-thumb:hover { background: rgba(204, 0, 48, 0.55) !important; }
    @supports not selector(::-webkit-scrollbar) {
      .roller-scroll {
        scrollbar-width: thin !important;
        scrollbar-color: rgba(204, 0, 48, 0.35) transparent !important;
      }
    }
  </style>
</head>

<body style="margin: 0; background-color: #ffffff;">
  <div id="root"></div>
  <script type="module" src="/src/owlbear/popover.tsx"></script>
</body>

</html>
