<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>D&D Archive Dice</title>
  <style>
    /* The popover scrolls by wheel and touch; a bar beside it only eats width.
       Important: the site's stylesheet loads after this and gives every element
       a thin dark scrollbar of its own. */
    * { scrollbar-width: none !important; }
    *::-webkit-scrollbar { display: none !important; }

    /* The places that do scroll — each tab's pane and the roll log — get a slim,
       quiet bar in the roller's own red, on a clear track. */
    .roller-scroll {
      scrollbar-width: thin !important;
      scrollbar-color: rgba(204, 0, 48, 0.3) transparent !important;
    }
    .roller-scroll::-webkit-scrollbar { display: block !important; width: 5px !important; }
    .roller-scroll::-webkit-scrollbar-track { background: transparent !important; }
    .roller-scroll::-webkit-scrollbar-thumb { background: rgba(204, 0, 48, 0.3) !important; border-radius: 999px !important; }
    .roller-scroll::-webkit-scrollbar-thumb:hover { background: rgba(204, 0, 48, 0.6) !important; }
  </style>
</head>

<body style="margin: 0; background-color: #ffffff;">
  <div id="root"></div>
  <script type="module" src="/src/owlbear/popover.tsx"></script>
</body>

</html>
